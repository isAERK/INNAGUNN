[package]
name = "innagunn"
version = "1.0.1"
description = "Unofficial local INNA personal archive tool"
authors = ["Erik Gokov"]
license = "MIT"
repository = ""
edition = "2021"


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
